<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Online JS Console</title>
  <style>
    body {
      background: #121212;
      color: #eee;
      font-family: monospace;
      padding: 20px;
    }
    textarea {
      width: 100%;
      height: 200px;
      background: #1e1e1e;
      color: #f5f5f5;
      border: 1px solid #444;
      padding: 10px;
    }
    #output {
      margin-top: 15px;
      background: #111;
      padding: 10px;
      height: 150px;
      overflow-y: auto;
      white-space: pre-wrap;
      border: 1px solid #444;
    }
    button {
      margin-top: 10px;
      padding: 10px 20px;
      background: #00e676;
      color: #000;
      border: none;
      font-size: 14px;
      cursor: pointer;
    }
  </style>
</head>
<body>

  <h2>Online JavaScript Console</h2>
  <textarea id="codeInput" placeholder="Write JavaScript code here..."></textarea>
  <br />
  <button onclick="runCode()">Run Code</button>
  <div id="output">Output will appear here...</div>

  <script>
    async function runCode() {
      const code = document.getElementById('codeInput').value;
      const output = document.getElementById('output');

      const res = await fetch('/run', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ code }),
      });

      const result = await res.json();
      output.innerText = result.output || result.error;
    }
  </script>

</body>
</html>
